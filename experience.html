<!-- Set before the first paint, not at the end of <body> where main.js
     lands. Without this the browser paints every .reveal section at full
     opacity, main.js arrives and blanks them, and the observer fades them
     back — and that double take is the white flash between pages. -->
<script>
  document.documentElement.classList.add("js");
  /* main.js stamps data-js-ready as soon as it's alive. If it never
     arrives, take the class back off rather than leave a page of
     permanently invisible sections. */
  setTimeout(function () {
    if (!document.documentElement.hasAttribute("data-js-ready"))
      document.documentElement.classList.remove("js");
  }, 2500);
</script>
